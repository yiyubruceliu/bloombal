<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="LMS integration and knowledge validation flow">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a30"/><stop offset="0.5" stop-color="#082848"/><stop offset="1" stop-color="#0a3054"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" rx="20" fill="url(#bg3)"/>
  <rect width="600" height="600" rx="20" fill="url(#grid3)"/>
  <!-- LMS window -->
  <rect x="96" y="120" width="408" height="250" rx="16" fill="#0d2d52" stroke="#77cafc" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="96" y="120" width="408" height="40" fill="#113a66"/>
  <circle cx="120" cy="140" r="6" fill="#ff8a3d"/><circle cx="140" cy="140" r="6" fill="#77cafc"/><circle cx="160" cy="140" r="6" fill="#8ff0c0"/>
  <text x="300" y="146" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" fill="#9fc4e8">LMS</text>
  <!-- rows -->
  <g>
    <rect x="124" y="188" width="352" height="30" rx="8" fill="#113a66"/>
    <rect x="124" y="232" width="352" height="30" rx="8" fill="#113a66"/>
    <rect x="124" y="276" width="260" height="30" rx="8" fill="#113a66"/>
    <rect x="132" y="194" width="140" height="18" rx="6" fill="#77cafc" opacity="0.5"/>
    <rect x="132" y="238" width="190" height="18" rx="6" fill="#77cafc" opacity="0.5"/>
    <rect x="132" y="282" width="110" height="18" rx="6" fill="#77cafc" opacity="0.5"/>
    <circle cx="452" cy="203" r="12" fill="#8ff0c0"/><path d="M446 203l5 5 9-10" stroke="#082848" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="452" cy="247" r="12" fill="#8ff0c0"/><path d="M446 247l5 5 9-10" stroke="#082848" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- integration gear badge -->
  <g transform="translate(300 430)">
    <circle r="56" fill="#0d2d52" stroke="#ff8a3d" stroke-width="2.5"/>
    <g fill="none" stroke="#ff8a3d" stroke-width="4" stroke-linecap="round">
