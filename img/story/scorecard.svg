<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Accountability scorecard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a30"/><stop offset="0.5" stop-color="#082848"/><stop offset="1" stop-color="#0a3054"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f6ea8"/><stop offset="1" stop-color="#77cafc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" rx="20" fill="url(#bg)"/>
  <rect width="600" height="600" rx="20" fill="url(#grid)"/>
  <!-- card -->
  <rect x="96" y="120" width="408" height="300" rx="18" fill="#0d2d52" stroke="#77cafc" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="128" y="170" font-family="'Space Grotesk',sans-serif" font-size="26" font-weight="700" fill="#eaf2fb">Integrity Score</text>
  <text x="128" y="206" font-family="'Space Grotesk',sans-serif" font-size="18" fill="#9fc4e8">Semester overview</text>
  <!-- bars -->
  <g>
    <rect x="140" y="300" width="46" height="80" rx="8" fill="url(#bar)" opacity="0.85"/>
    <rect x="212" y="268" width="46" height="112" rx="8" fill="url(#bar)" opacity="0.9"/>
    <rect x="284" y="236" width="46" height="144" rx="8" fill="url(#bar)"/>
    <rect x="356" y="204" width="46" height="176" rx="8" fill="url(#bar)"/>
  </g>
  <line x1="140" y1="384" x2="448" y2="384" stroke="#2f6ea8" stroke-width="2"/>
  <!-- verified seal -->
  <circle cx="440" cy="150" r="34" fill="#8ff0c0"/>
  <path d="M424 150l11 11 22-23" fill="none" stroke="#082848" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- caption chip -->
  <rect x="96" y="452" width="268" height="52" rx="12" fill="#0d2d52" stroke="#ff8a3d" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="126" cy="478" r="8" fill="#ff8a3d"/>
  <text x="146" y="485" font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="600" fill="#ffd9bd">Measurable outcomes</text>
</svg>
